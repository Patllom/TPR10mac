name: tpr10-foundation
services:
  postgres:
    image: postgres:17.11-alpine3.24
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_DB: tpr10
      POSTGRES_USER: tpr10_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องกำหนดรหัสผ่าน local}
    volumes:
      - foundation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpr10_app -d tpr10"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  foundation_data:
